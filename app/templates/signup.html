{% extends "base.html" %}

{% block title %}회원가입 - News Delivery{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/signup.css') }}">
{% endblock %}

{% block content %}
  <div class="signup-container">
    <div class="signup-header">
      <h1>회원가입</h1>
      <p>News Delivery에 가입하세요!</p>
    </div>

    {% if message %}
      <div class="message {{ message_type }}">{{ message }}</div>
    {% endif %}

    <form class="signup-form" action="{{ request.url_for('signup') }}" method="post">
      <div class="input-group">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="성함을 입력하세요" value="{{ form_data.get('name', '') }}" required>
      </div>

      <div class="input-group">
        <label for="birth">생년월일</label>
        <input id="birth" name="birth" type="date" value="{{ form_data.get('birth', '') }}" required>
      </div>

      <div class="input-group">
        <label for="user_id">아이디</label>
        <input id="user_id" name="user_id" type="text" placeholder="사용할 아이디를 입력하세요" value="{{ form_data.get('user_id', '') }}" required>
      </div>

      <div class="input-group">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호 (8자 이상)" required>
      </div>

      <div class="input-group">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" placeholder="example@news.com" value="{{ form_data.get('email', '') }}" required>
      </div>

      <div class="input-group">
        <label for="phone">전화번호</label>
        <input id="phone" name="phone" type="tel" placeholder="010-0000-0000" value="{{ form_data.get('phone', '') }}" required>
      </div>

      <div class="button-group">
        <button type="submit" class="form-button primary">회원가입</button>
        <a class="form-button secondary link-button" href="{{ request.url_for('login_page') }}">로그인으로 이동</a>
      </div>
    </form>

    {% if focus %}
    <script>
      document.getElementById("{{ focus }}").focus();
    </script>
    {% endif %}

  </div>
{% endblock %}
