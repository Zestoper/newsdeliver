{% extends "base.html" %}

{% block title %}뉴스 작성 - News Delivery{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/write.css') }}">
{% endblock %}

{% block content %}
<div class="write-container">
  <h2>📰 뉴스 작성</h2>
  <div class="write-box">
    <form action="/press/write" method="post">
      <div class="write-group">
        <label>제목</label>
        <input name="title" type="text" placeholder="뉴스 제목을 입력하세요" required>
      </div>
      <div class="write-group">
        <label>본문</label>
        <textarea name="content" rows="12" placeholder="본문을 입력하세요" required></textarea>
      </div>
      <div class="write-group">
        <label>이미지 URL</label>
        <input name="image_url" type="text" placeholder="https://...">
      </div>
      <div class="write-group">
        <label>출처</label>
        <input name="source" type="text" placeholder="출처를 입력하세요">
      </div>
      <div class="write-group">
        <label>발행 상태</label>
        <select name="status">
          <option value="draft">임시저장</option>
          <option value="published">발행</option>
        </select>
      </div>
      <div class="write-group">
        <label>카테고리</label>
        <select name="category_id">
          <option value="">선택 안함</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="write-btns">
        <button type="submit" class="btn-submit">저장</button>
        <a href="/press/news" class="btn-back">목록으로</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
