<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}News Delivery{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; line-height: 1.6; }

    .site-back-btn {
      position: fixed;
      top: 12px;
      left: 20px;
      z-index: 9999;
      padding: 7px 16px;
      background: white;
      color: #c00;
      border: 1.5px solid #c00;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .site-back-btn:hover { background: #fff0f0; }
  </style>

  {% block head %}{% endblock %}
</head>
<body>

  <button class="site-back-btn" onclick="history.back()">← 뒤로가기</button>

  {% block back_btn %}{% endblock %}

  <div class="app-container">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
