<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}News Delivery{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* 이모지 대신 쓰는 인라인 SVG 아이콘 */
    svg.ic { display: inline-block; vertical-align: -0.125em; flex-shrink: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; line-height: 1.6; }

    .site-back-btn {
      position: fixed;
      top: 12px;
      left: 20px;
      z-index: 9999;
      padding: 7px 16px;
      background: white;
      color: #c00;
      border: 1.5px solid #c00;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .site-back-btn:hover { background: #fff0f0; }
  </style>

  {% block head %}{% endblock %}
</head>
<body>

  {% block back_btn %}
  <button class="site-back-btn" onclick="history.back()"><svg class="ic" width="1em" height="1em" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 뒤로가기</button>
  {% endblock %}

  <div class="app-container">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
