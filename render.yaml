services:
  - type: web
    name: newsdeliver
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # React 프론트엔드(Vercel) 주소 — CORS 허용, 이메일 링크, 소셜 로그인·결제 후 이동에 사용
      - key: FRONTEND_URL
        sync: false
      # 외부 크론(cron-job.org)이 /internal/jobs/* 를 호출할 때 쓰는 비밀 키
      # 설정하면 서버 안의 스케줄러 대신 외부 크론 모드로 동작한다
      - key: CRON_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.naver.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_REDIRECT_URI
        sync: false
      - key: NAVER_OAUTH_CLIENT_ID
        sync: false
      - key: NAVER_OAUTH_CLIENT_SECRET
        sync: false
      - key: NAVER_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SERVER_BASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: SKIP_PAYMENT
        value: "false"
